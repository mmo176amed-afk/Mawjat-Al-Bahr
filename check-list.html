<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التأكد من قائمة المشاركين</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    * { box-sizing:border-box; margin:0; padding:0; font-family:'Tajawal',sans-serif; }
    body { background:#f1f5f9; color:#334155; padding:20px 15px 50px; }
    .header { background:linear-gradient(135deg,#0369a1 0%,#0f172a 100%); color:white; padding:20px 15px; text-align:center; border-radius:14px; margin-bottom:20px; }
    .header h1 { font-size:1.25rem; font-weight:800; }
    .container { max-width:1000px; margin:0 auto; }
    .card { background:white; border-radius:16px; padding:22px; box-shadow:0 10px 25px rgba(0,0,0,0.06); border:1px solid #e2e8f0; margin-bottom:20px; }
    .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; }
    label { font-size:0.86rem; font-weight:700; color:#475569; display:block; margin-bottom:5px; }
    input, select { width:100%; padding:11px 13px; border-radius:8px; border:1.5px solid #cbd5e1; font-size:0.95rem; outline:none; background:#f8fafc; }
    input:focus, select:focus { border-color:#0284c7; background:#fff; }
    select:disabled { background:#e2e8f0; cursor:not-allowed; color:#64748b; }
    .btn { width:100%; margin-top:18px; padding:13px; background:#0284c7; color:white; border:none; border-radius:10px; font-size:1rem; font-weight:700; cursor:pointer; display:flex; justify-content:center; align-items:center; gap:8px; }
    .btn:hover { background:#0369a1; }
    .btn:disabled { background:#94a3b8; }
    .error-box { display:none; text-align:center; padding:14px; background:#fef2f2; border:1px solid #fca5a5; border-radius:8px; margin-top:15px; color:#991b1b; font-weight:700; }
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px; }
    .stat-box { background:white; border:1px solid #e2e8f0; border-radius:12px; padding:16px; text-align:center; }
    .stat-box .num { font-size:1.6rem; font-weight:800; color:#0284c7; }
    .stat-box .lbl { font-size:0.82rem; color:#64748b; font-weight:700; margin-top:4px; }
    table { width:100%; border-collapse:collapse; font-size:0.85rem; }
    th, td { padding:9px 8px; text-align:center; border-bottom:1px solid #edf2f7; }
    th { background:#f1f5f9; color:#0369a1; font-weight:800; position:sticky; top:0; }
    tr:hover { background:#f8fafc; }
    .table-wrap { overflow-x:auto; }
    .back-link { display:inline-block; margin-bottom:15px; color:#0284c7; font-weight:700; text-decoration:none; }
</style>
</head>
<body>
<div class="container">
    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-right"></i> رجوع للتسجيل</a>
    <div class="header">
        <h1><i class="fa-solid fa-clipboard-check"></i> التأكد من قائمة المشاركين</h1>
    </div>

    <div id="loginCard" class="card">
        <div class="form-grid">
            <div class="form-group">
                <label>إسم المركز / النادي *</label>
                <select id="clubInput">
                    <option value="">-- اختر المركز --</option>
                </select>
            </div>
            <div class="form-group">
                <label>إسم ولقب المدرب *</label>
                <select id="coachInput" disabled>
                    <option value="">-- اختر المركز أولاً --</option>
                </select>
            </div>
            <div class="form-group">
                <label>رقم الهاتف (كلمة السر) * <span style="font-weight:normal; color:#dc2626; font-size:0.8rem;">(بدون صفر في البداية)</span></label>
                <input type="tel" id="phoneInput" placeholder="666925680">
            </div>
        </div>
        <button id="checkBtn" class="btn"><i class="fa-solid fa-magnifying-glass"></i> عرض قائمتي</button>
        <div id="errBox" class="error-box"></div>
    </div>

    <div id="resultCard" style="display:none;">
    <div class="stats-grid" id="statsGrid"></div>

    <!-- ====== قسم رفع صورة الوصل ====== -->
    <div class="card" style="border-right: 4px solid #d97706; margin-bottom: 20px;">
        <h3 style="color:#0369a1; margin-bottom:15px; display:flex; align-items:center; gap:8px;">
            <i class="fa-solid fa-file-invoice"></i> تأكيد التسجيلات - رفع صورة الوصل (إثبات الدفع)
        </h3>

        <div style="background:#fef2f2; border-right:4px solid #dc2626; padding:10px; border-radius:6px; margin-bottom:15px; font-size:0.85rem; color:#991b1b;">
            <i class="fa-solid fa-exclamation-triangle"></i>
            <strong>مهم:</strong> يجب رفع صورة الوصل (إثبات الدفع) قبل تأكيد التسجيلات.
        </div>

        <div id="voucherStatus" style="display:none; background:#f0fdf4; border-right:4px solid #059669; padding:12px; border-radius:6px; margin-bottom:15px;">
            <strong style="color:#166534;">✅ تم رفع الصورة بنجاح:</strong>
            <span id="voucherFileName" style="color:#166534;"></span>
            <div style="margin-top:8px;">
                <img id="voucherPreview" src="" style="max-width:200px; max-height:150px; border-radius:6px; cursor:pointer;" onclick="window.open(this.src, '_blank')">
            </div>
        </div>

        <label style="display:block; margin-bottom:8px; font-weight:700; color:#475569;">
            اختر صورة الوصل:
        </label>
        <input type="file" id="voucherFile" accept="image/*" style="width:100%; padding:10px; border:2px dashed #cbd5e1; border-radius:8px; margin-bottom:15px; cursor:pointer;">

        <button type="button" onclick="uploadVoucher()" style="background:#059669; color:white; border:none; padding:12px 24px; border-radius:10px; font-size:1rem; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:8px;">
            <i class="fa-solid fa-upload"></i> رفع صورة الوصل
        </button>

        <div id="uploadMsg" style="display:none; margin-top:12px; padding:10px; border-radius:6px; font-weight:700;"></div>
    </div>

    <div class="card">
        <div class="table-wrap">
            <table>
               
                    <thead>
                    <tr>
                        <th>اللقب</th><th>الاسم</th><th>تاريخ الميلاد</th><th>المستوى</th>
                        <th>نوع المشاركة</th><th>لعبة الذكاء</th><th>فلاش أنزان</th><th>الأكواب السريعة</th>
                        <th>حالة التأكيد</th><th>الإجراء</th>
                    </tr>
                </thead>
                <tbody id="studentsBody"></tbody>
            </table>
        </div>

        <!-- زر تأكيد الجميع -->
        <div style="margin-top:20px; text-align:center;">
            <button type="button" onclick="confirmAllStudents()" id="confirmAllBtn" style="background:#0284c7; color:white; border:none; padding:14px 30px; border-radius:10px; font-size:1rem; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:8px;">
                <i class="fa-solid fa-check-double"></i> تأكيد جميع التلاميذ
            </button>
        </div>
    </div>
</div>
</div>

<script>
    const SCRIPT_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwIk62p19JWRBhTEbRAD7lF7KYENPjke4vp4Zuo6BaXzcwyRMcDYt77Ro1JVGGcG_c9pQ/exec";

    const clubSelect = document.getElementById('clubInput');
    const coachSelect = document.getElementById('coachInput');
    let currentCoachesList = [];

    // متغيرات التأكيد
    let uploadedVoucherUrl = "";
    let uploadedVoucherName = "";
    let currentStudentsList = [];

    // 1. تحميل كل المراكز عند فتح الصفحة
    fetch(`${SCRIPT_WEB_APP_URL}?action=getAllCenters`)
        .then(r => r.json())
        .then(res => {
            console.log('getAllCenters response:', res);
            const centers = res.centers || [];
            if (centers.length === 0) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = res.error ? ('خطأ: ' + res.error) : 'لا توجد مراكز مسجلة في الشيت';
                clubSelect.appendChild(opt);
                return;
            }
            centers.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                clubSelect.appendChild(opt);
            });
        })
        .catch(err => {
            console.error('فشل تحميل المراكز:', err);
            const opt = document.createElement('option');
            opt.value = '';
            opt.textContent = 'تعذر الاتصال بالخادم';
            clubSelect.appendChild(opt);
        });

    // 2. عند اختيار المركز، نجلب قائمة المدربين الخاصة به فقط
    clubSelect.addEventListener('change', () => {
        const club = clubSelect.value;
        coachSelect.innerHTML = '';
        currentCoachesList = [];

        if (!club) {
            coachSelect.disabled = true;
            const opt = document.createElement('option');
            opt.value = '';
            opt.textContent = '-- اختر المركز أولاً --';
            coachSelect.appendChild(opt);
            return;
        }

        coachSelect.disabled = true;
        coachSelect.innerHTML = '<option value="">جاري التحميل...</option>';

        fetch(`${SCRIPT_WEB_APP_URL}?action=searchCenter&club=${encodeURIComponent(club)}`)
            .then(r => r.json())
            .then(res => {
                coachSelect.innerHTML = '';
                if (res && res.found && res.coaches && res.coaches.length > 0) {
                    currentCoachesList = res.coaches;
                    const defaultOpt = document.createElement('option');
                    defaultOpt.value = '';
                    defaultOpt.textContent = '-- اختر المدرب --';
                    coachSelect.appendChild(defaultOpt);

                    currentCoachesList.forEach(cItem => {
                        const opt = document.createElement('option');
                        opt.value = cItem.coach;
                        opt.textContent = cItem.coach;
                        coachSelect.appendChild(opt);
                    });
                    coachSelect.disabled = false;
                } else {
                    const opt = document.createElement('option');
                    opt.value = '';
                    opt.textContent = 'لا يوجد مدربون لهذا المركز';
                    coachSelect.appendChild(opt);
                    coachSelect.disabled = true;
                }
            })
            .catch(() => {
                coachSelect.innerHTML = '<option value="">تعذر تحميل المدربين</option>';
                coachSelect.disabled = true;
            });
    });

    document.getElementById('checkBtn').addEventListener('click', () => {
        const club = clubSelect.value.trim();
        const coach = coachSelect.value.trim();
        const phone = document.getElementById('phoneInput').value.trim();
        const errBox = document.getElementById('errBox');
        errBox.style.display = 'none';

        if (!club || !coach || !phone) {
            errBox.innerText = '⚠️ يرجى تعبئة جميع الحقول';
            errBox.style.display = 'block';
            return;
        }

        const btn = document.getElementById('checkBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري التحقق...';

        fetch(`${SCRIPT_WEB_APP_URL}?action=verifyCoachList&club=${encodeURIComponent(club)}&coach=${encodeURIComponent(coach)}&phone=${encodeURIComponent(phone)}`)
            .then(r => r.json())
            .then(res => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> عرض قائمتي';

                if (!res.found) {
                    if (res.error === 'wrongphone') {
                        errBox.innerText = '❌ رقم هاتفك خاطئ، لا نستطيع أن نعطيك القائمة. تأكد من الرقم.';
                    } else {
                        errBox.innerText = '❌ لم يتم العثور على مركز أو مدرب بهذا الاسم.';
                    }
                    errBox.style.display = 'block';
                    document.getElementById('resultCard').style.display = 'none';
                    return;
                }

                renderResults(res);
            })
            .catch(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> عرض قائمتي';
                errBox.innerText = '❌ حدث خطأ أثناء الاتصال، حاول مجدداً.';
                errBox.style.display = 'block';
            });
    });

    function renderResults(res) {
    const s = res.stats;
    document.getElementById('statsGrid').innerHTML = `
        <div class="stat-box"><div class="num">${s.total}</div><div class="lbl">إجمالي المشاركين</div></div>
        <div class="stat-box"><div class="num">${s.presentiel}</div><div class="lbl">حضوري</div></div>
        <div class="stat-box"><div class="num">${s.online}</div><div class="lbl">أون لاين</div></div>
        <div class="stat-box"><div class="num">${s.smartGames}</div><div class="lbl">ألعاب الذكاء</div></div>
        <div class="stat-box"><div class="num">${s.cups}</div><div class="lbl">الأكواب السريعة</div></div>
        <div class="stat-box"><div class="num">${s.flashAnzan}</div><div class="lbl">فلاش أنزان</div></div>
    `;

    const body = document.getElementById('studentsBody');
    body.innerHTML = res.students.map(st => {
        const isConfirmed = st.confirmStatus === "مؤكد";
        const statusBadge = isConfirmed 
            ? '<span style="background:#10b981; color:white; padding:4px 10px; border-radius:6px; font-size:0.8rem; font-weight:700;">✅ مؤكد</span>'
            : '<span style="background:#f59e0b; color:white; padding:4px 10px; border-radius:6px; font-size:0.8rem; font-weight:700;">⏳ غير مؤكد</span>';
        
        const actionBtn = isConfirmed
            ? '<span style="color:#64748b; font-size:0.85rem;">تم التأكيد</span>'
            : `<button onclick="confirmStudent(${st.rowIndex}, '${st.lastName}', '${st.firstName}')" style="background:#0284c7; color:white; border:none; padding:6px 12px; border-radius:6px; font-size:0.8rem; font-weight:700; cursor:pointer;">📎 تأكيد التسجيل</button>`;

        return `
        <tr>
            <td>${st.lastName}</td>
            <td>${st.firstName}</td>
            <td>${st.birth}</td>
            <td>${st.level || '-'}</td>
            <td>${st.attendanceType}</td>
            <td>${st.smartGame || 'بدون مشاركة'}</td>
            <td>${st.flashAnzan ? '✅ نعم' : '❌ لا'}</td>
            <td>${st.cups ? '✅ نعم' : '❌ لا'}</td>
            <td>${statusBadge}</td>
            <td>${actionBtn}</td>
        </tr>
        `;
    }).join('');

        // حفظ قائمة التلاميذ للتأكيد الجماعي
    currentStudentsList = res.students;
    document.getElementById('resultCard').style.display = 'block';
}
// ============================================
// رفع صورة الوصل
// ============================================
document.getElementById('voucherFile').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
            document.getElementById('voucherPreview').src = event.target.result;
            document.getElementById('voucherFileName').textContent = file.name;
            document.getElementById('voucherStatus').style.display = 'block';
        };
        reader.readAsDataURL(file);
    }
});

function uploadVoucher() {
    const fileInput = document.getElementById('voucherFile');
    const file = fileInput.files[0];
    const msgBox = document.getElementById('uploadMsg');

    msgBox.style.display = 'none';

    if (!file) {
        msgBox.textContent = '⚠️ يرجى اختيار صورة الوصل أولاً.';
        msgBox.style.background = '#fef2f2';
        msgBox.style.color = '#991b1b';
        msgBox.style.display = 'block';
        return;
    }

    if (file.size > 5 * 1024 * 1024) {
        msgBox.textContent = '⚠️ حجم الصورة كبير جداً. الحد الأقصى 5 ميغابايت.';
        msgBox.style.background = '#fef2f2';
        msgBox.style.color = '#991b1b';
        msgBox.style.display = 'block';
        return;
    }

    const reader = new FileReader();
    reader.onload = function(event) {
        const base64Data = event.target.result.split(',')[1];
        const fileName = 'voucher_' + Date.now() + '_' + file.name;

        msgBox.textContent = '⏳ جاري رفع الصورة...';
        msgBox.style.background = '#eff6ff';
        msgBox.style.color = '#1e40af';
        msgBox.style.display = 'block';

        const params = new URLSearchParams({
            action: 'uploadVoucherToDrive',
            fileName: fileName,
            fileData: base64Data,
            mimeType: file.type
        });

        fetch(SCRIPT_WEB_APP_URL + '?' + params.toString())
            .then(r => r.json())
            .then(res => {
                if (res.success) {
                    uploadedVoucherUrl = res.fileUrl;
                    uploadedVoucherName = fileName;
                    msgBox.textContent = '✅ تم رفع الصورة بنجاح! يمكنك الآن تأكيد التسجيلات.';
                    msgBox.style.background = '#f0fdf4';
                    msgBox.style.color = '#166534';
                    msgBox.style.display = 'block';
                } else {
                    msgBox.textContent = '❌ فشل الرفع: ' + (res.error || 'خطأ غير معروف');
                    msgBox.style.background = '#fef2f2';
                    msgBox.style.color = '#991b1b';
                    msgBox.style.display = 'block';
                }
            })
            .catch(err => {
                msgBox.textContent = '❌ خطأ في الاتصال: ' + err.message;
                msgBox.style.background = '#fef2f2';
                msgBox.style.color = '#991b1b';
                msgBox.style.display = 'block';
            });
    };
    reader.readAsDataURL(file);
}

// ============================================
// تأكيد تلميذ واحد
// ============================================
function confirmStudent(rowIndex, lastName, firstName) {
    if (!uploadedVoucherUrl) {
        alert('⚠️ يجب رفع صورة الوصل أولاً قبل تأكيد التسجيلات!');
        return;
    }

    if (!confirm('هل أنت متأكد من تأكيد تسجيل: ' + lastName + ' ' + firstName + '؟')) {
        return;
    }

    fetch(`${SCRIPT_WEB_APP_URL}?action=confirmStudentRow&rowIndex=${rowIndex}&voucherUrl=${encodeURIComponent(uploadedVoucherUrl)}`)
        .then(r => r.json())
        .then(res => {
            if (res.success) {
                alert('✅ تم تأكيد تسجيل: ' + lastName + ' ' + firstName);
                document.getElementById('checkBtn').click();
            } else {
                alert('❌ فشل التأكيد: ' + (res.error || 'خطأ غير معروف'));
            }
        })
        .catch(err => {
            alert('❌ خطأ في الاتصال: ' + err.message);
        });
}

// ============================================
// تأكيد جميع التلاميذ
// ============================================
function confirmAllStudents() {
    if (!uploadedVoucherUrl) {
        alert('⚠️ يجب رفع صورة الوصل أولاً قبل تأكيد التسجيلات!');
        return;
    }

    if (!currentStudentsList || currentStudentsList.length === 0) {
        alert('⚠️ لا يوجد تلاميذ للتأكيد.');
        return;
    }

    if (!confirm('هل أنت متأكد من تأكيد تسجيل جميع التلاميذ (' + currentStudentsList.length + ' تلميذ)؟')) {
        return;
    }

    const rowIndices = currentStudentsList
        .filter(st => st.confirmStatus !== "مؤكد")
        .map(st => st.rowIndex);

    if (rowIndices.length === 0) {
        alert('✅ جميع التلاميذ مؤكدون بالفعل.');
        return;
    }

    const btn = document.getElementById('confirmAllBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري التأكيد...';

    fetch(`${SCRIPT_WEB_APP_URL}?action=confirmAllStudents&rowIndices=${rowIndices.join(',')}&voucherUrl=${encodeURIComponent(uploadedVoucherUrl)}`)
        .then(r => r.json())
        .then(res => {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-check-double"></i> تأكيد جميع التلاميذ';

            if (res.success) {
                alert('✅ تم تأكيد تسجيل ' + res.count + ' تلميذ بنجاح!');
                document.getElementById('checkBtn').click();
            } else {
                alert('❌ فشل التأكيد: ' + (res.error || 'خطأ غير معروف'));
            }
        })
        .catch(err => {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-check-double"></i> تأكيد جميع التلاميذ';
            alert('❌ خطأ في الاتصال: ' + err.message);
        });
}
</script>
</body>
</html>
